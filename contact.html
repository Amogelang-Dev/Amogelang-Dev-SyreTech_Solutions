<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | SyreTech Solutions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">SyreTech Solutions</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
        <li><a href="admin.html" class="btn-admin">Admin Portal</a></li>
      </ul>
    </div>
  </header>

  <main>
    <h1 class="page-title">Get in Touch</h1>
    <p class="page-subtitle">Have a system or project request? Let's discuss requirements.</p>

    <div style="max-width: 600px; margin: 0 auto; background: var(--bg-card); padding: 2rem; border-radius: 12px; border: 1px solid var(--border-color);">
      <form id="contact-form">
        <div class="form-group">
          <label>Your Name</label>
          <input type="text" required placeholder="Name">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" required placeholder="email@domain.com">
        </div>
        <div class="form-group">
          <label>Project Scope & Requirements</label>
          <textarea rows="5" required placeholder="Describe your web, mobile, or database project..."></textarea>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%;">Submit Inquiry</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 SyreTech Solutions. All rights reserved.</p>
  </footer>
</body>
</html>
